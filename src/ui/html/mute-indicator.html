<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      background-color: #303030;
      -webkit-user-select: none;
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Top drag handle (visible when unlocked) */
    .dragbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 20px;
      -webkit-app-region: drag;
      background: rgba(255,255,255,0.22);
      border-bottom: 1px solid rgba(255,255,255,0.3);
      box-sizing: border-box;
    }
    .dragbar .grip {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      box-shadow: 8px 0 0 rgba(255,255,255,0.8), -8px 0 0 rgba(255,255,255,0.8);
      margin: 8px auto 0;
    }
    body.locked .dragbar { display: none; -webkit-app-region: no-drag; background: transparent; border-bottom-color: transparent; }

    /* Grid layout: 2 columns x 1 row, centered content */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-items: center;
      gap: 2px;
      padding: 3px;
      box-sizing: border-box;
      /* do not mark content as draggable */
    }

    .icon {
      width: auto;
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      -webkit-user-drag: none;
      user-select: none;
      display: block;
    }

    .dot-img {
      width: min(55%, 80%);
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      -webkit-user-drag: none;
      user-select: none;
      display: block;
    }

    .lock-toggle {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 16px;
      height: 16px;
      line-height: 16px;
      text-align: center;
      font-size: 14px;
      background: rgba(0,0,0,0.15);
      border-radius: 3px;
      cursor: pointer;
      opacity: 1;
      transition: opacity 120ms ease-in-out;
      color: #ccc;
      -webkit-app-region: no-drag;
    }
    body.locked .lock-toggle { opacity: 0; }
    body.locked:hover .lock-toggle { opacity: 1; }
  </style>
</head>
<body>
  <div class="dragbar"><div class="grip"></div></div>
  <div class="container">
    <img class="icon" draggable="false" src="img/discord.png" alt="Discord" />
    <img id="stateDot" class="dot-img" src="img/green-dot.svg" alt="mute status" draggable="false" />
  </div>
  

  <script>
    const { ipcRenderer } = require('electron')
    const body = document.body
    
    const stateDot = document.getElementById('stateDot')

    // Always suppress the default context menu and request the custom one
    window.addEventListener('contextmenu', (e) => {
      e.preventDefault()
      ipcRenderer.send('ui:contextmenu', { x: e.x, y: e.y })
    })

    function setLockedUI(locked) {
      if (locked) {
        body.classList.add('locked')
      } else {
        body.classList.remove('locked')
      }
    }

    function setMutedUI(muted) {
      if (!stateDot) return
      stateDot.src = muted ? 'img/red-dot.svg' : 'img/green-dot.svg'
    }

    let currentLocked = false
    ipcRenderer.on('mute-indicator:state', (_evt, payload) => {
      currentLocked = !!(payload && payload.locked)
      setLockedUI(currentLocked)
    })

    ipcRenderer.on('discord-mute:state', (_evt, payload) => {
      const muted = !!(payload && payload.muted)
      setMutedUI(muted)
    })

    // Request initial lock state
    ipcRenderer.send('mute-indicator:get-state')

    // Lock/Unlock via context menu only
  </script>
</body>
</html>
