<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      margin: 0;
      background-color: #303030;
      -webkit-user-select: none;
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Grid layout: 2 columns x 1 row, centered content */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      width: 100%;
      height: 100%;
      align-items: center;   /* vertical center */
      justify-items: center; /* horizontal center */
      gap: 2px; /* small gap between icon and dot */
      padding: 3px; /* small inner padding */
      box-sizing: border-box;
      -webkit-app-region: drag; /* allow moving the window */
    }
    body.locked .container { -webkit-app-region: no-drag; }

    .icon {
      width: auto;
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      -webkit-user-drag: none;
      user-select: none;
      display: block;
    }

    .dot-img {
      width: min(55%, 80%);
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      -webkit-user-drag: none;
      user-select: none;
      display: block;
    }

    .lock-toggle {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 16px;
      height: 16px;
      line-height: 16px;
      text-align: center;
      font-size: 14px;
      background: rgba(0,0,0,0.15);
      border-radius: 3px;
      cursor: pointer;
      opacity: 1;
      transition: opacity 120ms ease-in-out;
      color: #ccc;
      -webkit-app-region: no-drag; /* clickable even when content is draggable */
    }
    body.locked .lock-toggle { opacity: 0; }
    body.locked:hover .lock-toggle { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <img class="icon" draggable="false" src="img/discord.png" alt="Discord" />
    <img id="stateDot" class="dot-img" src="img/green-dot.svg" alt="mute status" draggable="false" />
  </div>
  <div class="lock-toggle" id="lockToggle" title="Toggle lock">🔓</div>

  <script>
    const { ipcRenderer } = require('electron')
    const body = document.body
    const lockToggle = document.getElementById('lockToggle')
    const stateDot = document.getElementById('stateDot')

    function setLockedUI(locked) {
      if (locked) {
        body.classList.add('locked')
        lockToggle.textContent = '🔒'
      } else {
        body.classList.remove('locked')
        lockToggle.textContent = '🔓'
      }
    }

    function setMutedUI(muted) {
      if (!stateDot) return
      stateDot.src = muted ? 'img/red-dot.svg' : 'img/green-dot.svg'
    }

    let currentLocked = false
    ipcRenderer.on('mute-indicator:state', (_evt, payload) => {
      currentLocked = !!(payload && payload.locked)
      setLockedUI(currentLocked)
    })

    ipcRenderer.on('discord-mute:state', (_evt, payload) => {
      const muted = !!(payload && payload.muted)
      setMutedUI(muted)
    })

    // Request initial lock state
    ipcRenderer.send('mute-indicator:get-state')

    lockToggle.addEventListener('click', (e) => {
      e.preventDefault()
      e.stopPropagation()
      currentLocked = !currentLocked
      setLockedUI(currentLocked)
      ipcRenderer.send('mute-indicator:set-locked', currentLocked)
    })
  </script>
</body>
</html>
